services:
    laravel.test:
        build:
            context: .
            dockerfile: Dockerfile
        image: 'jarvis-laravel:8.4'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
        environment:
            PHP_CLI_SERVER_WORKERS: '4'
            GOWA_BASE_URL: 'http://gowa:3000'
            REVERB_HOST: 'reverb'
        working_dir: /var/www/html
        command: php artisan serve --host=0.0.0.0 --port=80
        volumes:
            - '.:/var/www/html'
            - './docker/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_started
            redis:
                condition: service_healthy
            gowa:
                condition: service_started
        deploy:
            resources:
                limits:
                    memory: 512M

    reverb:
        image: 'jarvis-laravel:8.4'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${REVERB_PORT:-8080}:8080'
        environment:
            REVERB_SERVER_HOST: '0.0.0.0'
            REVERB_SERVER_PORT: 8080
            REVERB_HOST: 'reverb'
        working_dir: /var/www/html
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        volumes:
            - '.:/var/www/html'
            - './docker/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            laravel.test:
                condition: service_started
            redis:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 256M

    queue:
        image: 'jarvis-laravel:8.4'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            GOWA_BASE_URL: 'http://gowa:3000'
            REVERB_HOST: 'reverb'
        working_dir: /var/www/html
        command: php artisan queue:work --tries=3 --timeout=120
        volumes:
            - '.:/var/www/html'
            - './docker/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            laravel.test:
                condition: service_started
            redis:
                condition: service_healthy
            pgsql:
                condition: service_started
        deploy:
            resources:
                limits:
                    memory: 256M

    frontend:
        build:
            context: ../frontend
            dockerfile: Dockerfile
        image: 'jarvis-frontend:latest'
        ports:
            - '${FRONTEND_PORT:-5173}:5173'
        volumes:
            - '../frontend:/app'
            - 'frontend-node-modules:/app/node_modules'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            laravel.test:
                condition: service_started
            reverb:
                condition: service_started
        deploy:
            resources:
                limits:
                    memory: 512M

    pgsql:
        image: 'pgvector/pgvector:pg18'
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
        networks:
            - sail
        deploy:
            resources:
                limits:
                    memory: 512M

    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s
        deploy:
            resources:
                limits:
                    memory: 128M

    gowa:
        build:
            context: ../go-whatsapp-web-multidevice
            dockerfile: docker/golang.Dockerfile
        restart: unless-stopped
        ports:
            - '${FORWARD_GOWA_PORT:-3000}:3000'
        environment:
            APP_PORT: 3000
            APP_HOST: 0.0.0.0
            APP_DEBUG: 'false'
            APP_OS: 'Chrome'
            APP_BASIC_AUTH: '${GOWA_USERNAME:-user1}:${GOWA_PASSWORD:-pass1}'
            # Storage WhatsApp (SQLite)
            DB_URI: file:storages/whatsapp.db?_foreign_keys=on
            CHAT_STORAGE_MAX_OPEN_CONNS: 5
            # WhatsApp Settings
            WHATSAPP_AUTO_REPLY: ''
            WHATSAPP_AUTO_MARK_READ: 'false'
            WHATSAPP_AUTO_DOWNLOAD_MEDIA: 'true'
            WHATSAPP_ACCOUNT_VALIDATION: 'true'
            WHATSAPP_CHAT_STORAGE: 'true'
            # Webhook Forwarding ke Laravel di container laravel.test
            WHATSAPP_WEBHOOK: '${GOWA_TARGET_WEBHOOK_URL:-http://laravel.test/api/v1/webhooks/whatsapp}'
            WHATSAPP_WEBHOOK_SECRET: '${GOWA_WEBHOOK_SECRET}'
            WHATSAPP_WEBHOOK_INSECURE_SKIP_VERIFY: 'false'
            WHATSAPP_WEBHOOK_EVENTS: 'message,message.ack'
            WHATSAPP_WEBHOOK_IGNORE_JIDS: '@g.us' # Filter grup agar fokus ke chat personal driver
        volumes:
            - 'sail-gowa-storage:/app/storages'
            - 'sail-gowa-statics:/app/statics'
        networks:
            - sail
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        deploy:
            resources:
                limits:
                    memory: 256M
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-gowa-storage:
        driver: local
    sail-gowa-statics:
        driver: local
    frontend-node-modules:
        driver: local